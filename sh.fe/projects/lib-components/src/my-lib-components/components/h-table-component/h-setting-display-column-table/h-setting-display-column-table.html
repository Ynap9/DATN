<div class="w-full flex flex-col bg-white rounded-xl">

    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200">
        <div class="flex items-center gap-3">
            <p-checkbox
                name="selectedColumns"
                [binary]="true"
                inputId="selectAllCheckbox"
                [disabled]="isPinAll"
                [(ngModel)]="isCheckedAll"
                (onChange)="changeSelectedAll($event)">
            </p-checkbox>

            <label for="selectAllCheckbox" class="font-semibold text-gray-700">
                Tất cả {{ countColumnShow() }}
            </label>
        </div>
    </div>

    <div class="flex items-center gap-3 px-4 py-2 bg-gray-50 border-b border-gray-200">
        <div style="width: 20px; flex-shrink: 0;"></div>
        <span class="flex-1 text-xs font-semibold text-gray-500 uppercase tracking-wide">Tên cột</span>
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide" style="width: 100px; text-align: center;">Chiều rộng (rem)</span>
    </div>

    <div class="flex flex-col overflow-y-auto" style="max-height: 360px;">

        <ng-container *ngFor="let col of selectColumns">
            <div *ngIf="col?.displaySettingColumn"
                 class="flex items-center gap-3 px-4 py-2 border-b border-gray-100 hover:bg-gray-50 transition">

                <p-checkbox
                    name="group"
                    [binary]="true"
                    [disabled]="col?.isPin"
                    [(ngModel)]="col.isShow"
                    [inputId]="col.field"
                    (onChange)="checkIsCheckedAll()">
                </p-checkbox>

                <label [for]="col.field"
                       class="flex-1 text-gray-700 font-medium cursor-pointer select-none text-sm"
                       style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                    {{ col.header }}
                </label>

                <div class="flex items-center gap-1" style="width: 110px; flex-shrink: 0;">
                    <input
                        type="number"
                        min="40"
                        max="1200"
                        [placeholder]="col.customWidthRem || col.width || col.minWidth || '10'"
                        [(ngModel)]="col.customWidthRem"
                        (ngModelChange)="col.customWidthRem = ($event > 0 ? $event : undefined)"
                        style="width: 78px; padding: 3px 6px; border: 1px solid #d1d5db;
                               border-radius: 6px; font-size: 12px; color: #374151;
                               text-align: center; outline: none; background: #fff;"
                        (focus)="$event.target.style.borderColor='#6366f1'"
                        (blur)="$event.target.style.borderColor='#d1d5db'">
                    <span class="text-xs text-gray-400">rem</span>
                </div>

            </div>
        </ng-container>

    </div>

    <div class="flex justify-end gap-3 px-4 py-3 border-t border-gray-200 bg-gray-50">

        <button
            *ngIf="showReset"
            pButton
            pRipple
            label="Đặt lại mặc định"
            class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 transition mr-auto"
            (click)="resetDefault()">
        </button>

        <button
            pButton
            pRipple
            label="Hủy"
            class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 transition"
            (click)="cancel()">
        </button>

        <button
            pButton
            pRipple
            label="Áp dụng"
            [disabled]="submitted"
            class="px-4 py-2 rounded-lg bg-primary text-white hover:opacity-90 transition disabled:opacity-50"
            (click)="accept()">
        </button>

    </div>

</div>
