<div class="flex flex-col items-center text-center gap-4">

    <div *ngIf="dialogData?.icon" class="h-30 flex items-center justify-center">
        <p-image [src]="dialogData.icon" [imageStyle]="styleIcon">
        </p-image>
    </div>

    <div *ngIf="dialogData?.message" class="w-full">
        <span class="text-base font-medium text-gray-700" [innerHTML]="dialogData?.message">
        </span>
    </div>

    <div class="flex justify-center gap-3 w-full pt-4">
        <sh-button type="reset" severity="secondary" label="Huỷ" (onClick)="cancel()">
        </sh-button>

        <sh-button label="Xác nhận" (onClick)="accept()">
        </sh-button>
    </div>

</div>
