<app-breadcrumb [home]="home" [items]="breadcrumbs()" />
<div class="page-header-row">

        <h1 class="page-header-title">{{ title() }}</h1>

        }
    </div>
    <div class="page-header-actions">
        <ng-content />
    </div>
</div>
