<label class="column-settings-all">
    <p-checkbox [binary]="true" [ngModel]="checkedCount === items.length" (ngModelChange)="toggleAll($event)" />
    Tất cả ({{ checkedCount }}/{{ items.length }})
</label>

@if (lockedHeaders.length) {
    <div class="column-settings-locked"><i class="pi pi-lock"></i>{{ lockedHeaders.join(' · ') }} (luôn hiện)</div>
}

<div class="column-settings-list">
    <p-table [value]="items" dataKey="key">
        <ng-template #body let-item let-index="rowIndex">
            <tr [pReorderableRow]="index">
                <td class="column-settings-row">
                    <span class="pi pi-bars column-settings-handle" pReorderableRowHandle></span>
                    <p-checkbox [binary]="true" [(ngModel)]="item.visible" [inputId]="'col-' + item.key" />
                    <label [for]="'col-' + item.key">{{ item.header }}</label>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<div class="column-settings-footer">
    <p-button label="Đặt lại mặc định" severity="secondary" [text]="true" (onClick)="reset()" />
    <div class="flex gap-2">
        <p-button label="Huỷ" severity="secondary" [outlined]="true" (onClick)="close()" />
        <p-button label="Lưu" [disabled]="checkedCount === 0" (onClick)="save()" />
    </div>
</div>
