<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="flex flex-col gap-4">
        <sh-input-text label="Tên vai trò" formControlName="name" [required]="true" />
        <sh-input-text label="Mô tả" formControlName="description" [textarea]="true" [rows]="3" />
    </div>

    <div class="flex justify-end gap-2 mt-6">
        <p-button label="Hủy" severity="secondary" [outlined]="true" (onClick)="close()" />
        <p-button type="submit" label="Lưu" [loading]="submitting" />
    </div>
</form>
