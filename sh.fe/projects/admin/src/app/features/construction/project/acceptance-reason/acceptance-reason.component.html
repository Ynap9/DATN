<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="flex flex-col gap-2">
        @if (message) {
            <p class="m-0">{{ message }}</p>
        }
        <sh-input-text label="Lý do" formControlName="reason" [textarea]="true" [rows]="4" [maxlength]="maxLength" [required]="isRequired" />
        <small class="self-end text-muted-color">{{ form.controls.reason.value.length }} / {{ maxLength }}</small>
    </div>

    <div class="flex justify-end gap-2 mt-6">
        <p-button label="Hủy" severity="secondary" [outlined]="true" (onClick)="close()" />
        <p-button type="submit" [label]="confirmLabel" />
    </div>
</form>
