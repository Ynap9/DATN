<div class="entry-head">
    <div class="entry-title">
        <h2>Năng suất theo người nhập</h2>
        <span>Theo kết quả QA, sắp theo số văn bản</span>
    </div>
    @if (canViewAll) {
        <p-button [label]="'Xem tất cả (' + totalItems + ')'" [link]="true" size="small" (onClick)="openAll()" />
    }
</div>

@if (top.error && !top.loading) {
    <div class="entry-state">
        <span>Chưa tải được năng suất theo người nhập</span>
        <p-button label="Thử lại" icon="pi pi-refresh" severity="secondary" [outlined]="true" size="small" (onClick)="retry()" />
    </div>
} @else if (top.data) {
    <div [class.is-stale]="top.loading">
        <app-data-table [columns]="columns" [data]="topRows" dataKey="userId" [paginator]="false" />
    </div>
} @else {
    <p-skeleton height="200px" />
}

<p-dialog header="Năng suất theo người nhập" [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '760px' }" [breakpoints]="{ '800px': '95vw' }">
    <app-data-table [columns]="columns" [data]="allRows" dataKey="userId" [loading]="all.loading" [pageNumber]="allPageNumber" [pageSize]="allPageSize"
        [total]="all.data?.totalItems ?? 0" [rowsPerPageOptions]="dialogPageSizes" (pageChange)="onAllPageChange($event)" />
</p-dialog>
