<div class="flex flex-wrap items-end gap-3">
    <sh-select class="w-full sm:w-40" label="Loại" [options]="typeOptions" optionLabel="label" optionValue="value" [ngModel]="type" (ngModelChange)="onTypeChange($event)" />
    <sh-select class="w-full sm:w-40" label="Kết quả" [options]="resultOptions" optionLabel="label" optionValue="value" [ngModel]="result"
        (ngModelChange)="onResultChange($event)" />
    <sh-calendar class="w-full sm:w-44" label="Từ ngày" valueFormat="YYYY-MM-DD" [showClear]="true" [ngModel]="fromDate" (ngModelChange)="onFromDateChange($event)" />
    <sh-calendar class="w-full sm:w-44" label="Đến ngày" valueFormat="YYYY-MM-DD" [showClear]="true" [ngModel]="toDate" (ngModelChange)="onToDateChange($event)" />
    <p-iconfield class="w-full sm:ml-auto sm:w-72">
        <p-inputicon class="pi pi-search" />
        <input pInputText class="w-full" placeholder="Tìm tên dự án hoặc email" [formControl]="keyword" />
    </p-iconfield>
</div>

@if (isDateRangeInvalid) {
    <small class="mt-2 block text-[var(--app-red)]">Từ ngày phải trước hoặc bằng Đến ngày</small>
}

@if (project; as filter) {
    <div class="mt-3">
        <span class="inline-flex items-center gap-1.5 rounded-full border border-[var(--app-line)] bg-[var(--app-surface)] py-0.5 pr-1 pl-3 text-xs font-semibold text-[var(--app-muted)]">
            Dự án: {{ filter.name }}
            <button type="button" class="grid h-5 w-5 cursor-pointer place-items-center rounded-full border-0 bg-transparent text-[var(--app-muted)] hover:bg-[var(--app-bg)]"
                aria-label="Bỏ lọc dự án" (click)="clearProject()">
                <i class="pi pi-times text-[10px]"></i>
            </button>
        </span>
    </div>
}

<div class="mt-3">
    <app-data-table tableKey="construction-project-deadline-mail" [columns]="columns" [data]="rows" [loading]="loading" [pageNumber]="pageNumber"
        [pageSize]="pageSize" [total]="totalRecords" (pageChange)="onPageChange($event)">
        <div tableEmpty class="flex flex-col items-center gap-2 py-6">
            <span class="grid h-11 w-11 place-items-center rounded-full bg-[var(--app-bg)] text-[var(--app-muted)]"><i class="pi pi-envelope"></i></span>
            <span class="font-semibold text-[var(--app-ink)]">Chưa có mail báo hạn nào</span>
        </div>
    </app-data-table>
</div>
