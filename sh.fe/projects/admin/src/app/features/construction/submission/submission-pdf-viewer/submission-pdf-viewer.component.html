@if (loading()) {
    <div class="flex h-full items-center justify-center"><i class="pi pi-spin pi-spinner text-2xl text-muted-color"></i></div>
} @else if (error()) {
    <div class="flex h-full flex-col items-center justify-center gap-3 p-4 text-center">
        <i class="pi pi-file-excel text-[32px] text-gray-400"></i>
        <span class="text-sm text-gray-600">{{ error() }}</span>
        <p-button label="Thử lại" severity="secondary" [outlined]="true" size="small" (onClick)="retry()" />
    </div>
} @else if (pdfUrl()) {
    <iframe class="block h-full w-full border-0" title="File PDF của văn bản" [src]="pdfUrl()"></iframe>
}
