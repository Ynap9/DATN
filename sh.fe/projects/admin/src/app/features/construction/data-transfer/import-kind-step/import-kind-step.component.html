<div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2.5" role="radiogroup" aria-label="Kiểu import">
        @for (option of kindOptions; track option.value) {
            @let selected = kind() === option.value;
            <button type="button" role="radio" [attr.aria-checked]="selected" class="flex cursor-pointer items-start gap-3.5 rounded-xl px-[18px] py-4 text-left"
                [class]="selected ? 'border-[1.5px] border-[var(--app-accent)] bg-[#f3faf7]' : 'border border-[var(--app-line-strong)] bg-white'"
                (click)="selectKind(option.value)">
                <span class="mt-0.5 h-[18px] w-[18px] flex-none rounded-full" [class]="selected ? 'border-[5px] border-[var(--app-accent)]' : 'border-[1.5px] border-[#9aa7a2]'"></span>
                <span class="flex flex-col gap-0.5">
                    <span class="text-sm font-bold">{{ option.label }}</span>
                    <span class="text-[13px] text-[var(--app-muted)]">{{ option.description }}</span>
                </span>
            </button>
        }
    </div>

    <div class="grid grid-cols-1 gap-x-4 gap-y-3.5 sm:grid-cols-2">
        @if (isOverwrite) {
            <div class="flex flex-col gap-1">
                <sh-select label="Trường bị ghi đè" [required]="true" [options]="fieldOptions" optionLabel="label" optionValue="value" [filter]="true"
                    placeholder="Chọn trường" [ngModel]="mapping().documentFieldId" (ngModelChange)="selectOverwriteField($event)" />
            </div>
        }

        @for (field of columnFields; track field.key) {
            <div class="flex flex-col gap-1">
                <label [for]="field.key" class="text-xs font-semibold text-[var(--app-muted)]">{{ field.label }}{{ field.required ? ' *' : '' }}</label>
                <p-autocomplete [inputId]="field.key" class="w-full" [inputStyleClass]="'w-full'" appendTo="body" placeholder="Chọn hoặc gõ tên cột"
                    [dropdown]="true" [suggestions]="suggestions" [ngModel]="mapping()[field.key]" (ngModelChange)="setValue(field.key, $event ?? '')"
                    (completeMethod)="searchHeaders($event.query)" />
                @if (getSharedFieldNote(field.key); as note) {
                    <span class="text-xs text-[var(--app-amber)]">{{ note }}</span>
                }
            </div>
        }
    </div>

    @if (isOverwrite) {
        <label for="overwriteChecked" class="flex cursor-pointer items-start gap-3 rounded-xl border border-[var(--app-amber)] bg-[var(--app-amber-soft)] px-4 py-3">
            <p-checkbox inputId="overwriteChecked" [binary]="true" [ngModel]="mapping().overwriteChecked" (ngModelChange)="setValue('overwriteChecked', $event)" />
            <span class="flex flex-col gap-0.5">
                <span class="text-sm font-semibold">Ghi đè cả văn bản đã kiểm</span>
                <span class="text-[13px] text-[var(--app-muted)]">Không tick thì văn bản đã kiểm được giữ nguyên, chỉ ghi đè văn bản chưa kiểm / trả lại.</span>
            </span>
        </label>
    }
</div>
