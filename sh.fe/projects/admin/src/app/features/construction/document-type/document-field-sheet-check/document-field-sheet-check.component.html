<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="flex flex-col gap-4">
        <div>
            <div class="flex items-end gap-2">
                <sh-input-text class="flex-1" label="Link Google Sheet" formControlName="url" [required]="true"
                    placeholder="https://docs.google.com/spreadsheets/d/..." />
                <p-button label="Đọc sheet" severity="secondary" [outlined]="true" [loading]="loadingSheets" (onClick)="loadSheets()" />
            </div>
            @if (errorMessage) {
                <small class="text-red-600">{{ errorMessage }}</small>
            }
        </div>

        @if (sheets.length) {
            <div class="grid grid-cols-1 sm:grid-cols-[1fr_12rem_auto] items-end gap-2">
                <sh-select label="Sheet" formControlName="sheetName" [options]="sheets" optionLabel="sheetName" optionValue="sheetName" [required]="true" />
                <sh-input-number label="Dòng tiêu đề" formControlName="headerStartIndex" [min]="1" [useGrouping]="false" [required]="true" />
                <p-button type="submit" label="Kiểm tra" [loading]="checking" />
            </div>
        }

        @if (matches.length) {
            <app-data-table [columns]="columns" [data]="matches" [paginator]="false" />
            <p class="m-0 text-[13px] text-muted-color">Khớp {{ matchedCount }} / {{ matches.length }} trường</p>
        }
    </div>

    <div class="flex justify-end mt-6">
        <p-button label="Đóng" severity="secondary" [outlined]="true" (onClick)="close()" />
    </div>
</form>
