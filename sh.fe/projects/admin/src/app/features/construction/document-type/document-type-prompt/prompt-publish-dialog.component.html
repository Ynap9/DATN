<div class="flex flex-col gap-4">
    <p class="m-0">
        {{ version ? 'Xuất bản v' + version + '?' : 'Xuất bản bản nháp mới?' }}
        @if (publishedVersion) {
            Bản v{{ publishedVersion }} đang dùng sẽ chuyển lưu trữ.
        }
        Các lần OCR sau dùng bản mới.
    </p>
    <sh-input-text label="Ghi chú phiên bản" [formControl]="note" [textarea]="true" [rows]="3" [autoResize]="true" [maxlength]="noteMaxLength.toString()" />
</div>

<div class="flex justify-end gap-2 mt-6">
    <p-button label="Hủy" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button label="Xuất bản" icon="pi pi-send" (onClick)="publish()" />
</div>
