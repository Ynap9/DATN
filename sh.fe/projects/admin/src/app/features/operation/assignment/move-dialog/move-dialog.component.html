<!-- Mở chồng lên dialog phiếu, không header PrimeNG. Màu hex vì --app-* không có trong dialog -->
<div class="flex flex-col gap-4 pt-5 text-[#16201c]">
    <div class="flex items-start justify-between gap-3">
        <div>
            <h2 class="m-0 text-lg font-semibold">{{ title }}</h2>
            <p class="m-0 mt-1 text-[13px] text-[#5d6b66]">{{ subtitle }}</p>
        </div>
        <p-button icon="pi pi-times" [text]="true" [rounded]="true" severity="secondary" ariaLabel="Đóng" (onClick)="close()" />
    </div>

    <div class="flex flex-col gap-2 text-[13px]">
        <span class="text-xs font-semibold text-[#5d6b66]">Phạm vi</span>
        <label class="flex cursor-pointer items-center gap-2">
            <input type="radio" name="move-scope" class="h-4 w-4 cursor-pointer accent-[#0b7a63]" [checked]="scope === scopes.ALL"
                (change)="onScopeChange(scopes.ALL)" />
            Cả phiếu
        </label>
        <label class="flex cursor-pointer items-center gap-2">
            <input type="radio" name="move-scope" class="h-4 w-4 cursor-pointer accent-[#0b7a63]" [checked]="scope === scopes.ITEMS"
                (change)="onScopeChange(scopes.ITEMS)" />
            Chọn hộp / hồ sơ trong phiếu
        </label>
        @if (scope === scopes.ITEMS) {
            <div class="ml-6 max-h-[120px] overflow-auto rounded-md border border-[#e4e8e6] px-3 py-2">
                @if (loadingItems) {
                    <span class="text-[#8a958f]">Đang tải…</span>
                } @else {
                    @for (item of items ?? []; track $index) {
                        <label class="flex cursor-pointer items-center gap-2 py-0.5">
                            <input type="checkbox" class="h-4 w-4 cursor-pointer accent-[#0b7a63]" [checked]="selectedIndexes.has($index)"
                                (change)="toggleItem($index)" />
                            {{ getItemLabel(item) }}
                        </label>
                    } @empty {
                        <span class="text-[#8a958f]">Phiếu không còn hộp / hồ sơ</span>
                    }
                }
            </div>
        }
    </div>

    @if (isTransfer) {
        <sh-select label="Chuyển cho" [required]="true" [formControl]="recipientId" [options]="recipients" optionLabel="label" optionValue="userId"
            [filter]="true" [placeholder]="loadingRecipients ? 'Đang tải…' : isQa ? 'Chọn QA đang hoạt động' : 'Chọn người nhập liệu đang hoạt động'" />
    }

    <div class="rounded-md bg-[#f3f5f4] p-3 text-[13px] text-[#5d6b66]">{{ note }}</div>

    <div class="flex justify-end gap-2 border-t border-[#e4e8e6] pt-4">
        <p-button label="Huỷ" severity="secondary" [outlined]="true" (onClick)="close()" />
        @if (isTransfer) {
            <p-button label="Chuyển" [disabled]="!canSubmit" [loading]="submitting" (onClick)="submit()" />
        } @else {
            <p-button label="Thu hồi" severity="danger" [disabled]="!canSubmit" [loading]="submitting" (onClick)="submit()" />
        }
    </div>
</div>
